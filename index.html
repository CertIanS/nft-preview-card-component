<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <link href='https://fonts.googleapis.com/css?family=Outfit' rel='stylesheet'>
  <link href="./styles.css" rel="stylesheet">

</head>
<body>
  <main class="card">
    <section class="card_section" aria-describedby="equilTitle">
      <img src="./images/image-equilibrium.jpg" id="equilibrium" alt="equilibrium" width="325" height="325"/>
      <h3 id="equilTitle">Equilibrium #3429</h3>
      <p id="desc">Our Equilibrium collection promotes balance and calm.</p>

      <span id="eth"><img src="./images/icon-ethereum.svg" alt="ethereum"/> 0.041 ETH</span>
      <span id="daysLeft"><img src="./images/icon-clock.svg" alt="clock"/> 3 days left</span>
    </section>
    <hr>
    <footer class="card_footer">
      <p><img src="./images/image-avatar.png" id="avatar" alt="avatar" width="35" height="35"/>Creation of <b>Jules Wyvern</b></p>
    </footer>
  </main>
</body>
</html>
